  </text>

  <!-- KPI Pills Row -->
  <g transform="translate(44, 162)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">
