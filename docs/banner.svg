<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" role="img" aria-label="NSC Paper Figure Gallery Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#172542"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
