    <rect x="0" y="110" width="114" height="76" rx="12" fill="#162138" stroke="#28354d"/>
    <text x="14" y="138" font-size="22" font-weight="800" fill="#34d399">6 大方向</text>
    <text x="14" y="158" font-size="12" font-weight="600" fill="#e2e8f0">全学科覆盖</text>
    <text x="14" y="174" font-size="10.5" fill="#94a3b8">Bio·Mat·Eng·Phy·AI·Soc</text>

    <rect x="128" y="110" width="114" height="76" rx="12" fill="#162138" stroke="#28354d"/>
