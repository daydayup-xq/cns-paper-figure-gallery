  </defs>

  <rect width="920" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="110" cy="60" r="160" fill="url(#glowLeft)"/>
  <circle cx="810" cy="200" r="180" fill="url(#glowRight)"/>
  <rect x="0" y="0" width="920" height="4" fill="url(#accentGrad)"/>

  <!-- Decorative subtle grid lines -->
